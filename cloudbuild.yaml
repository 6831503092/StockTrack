steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/stocktrack:$COMMIT_SHA', '.']

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/stocktrack:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stocktrack'
      - '--image'
      - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/stocktrack:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'TZ=Asia/Bangkok'

images:
  - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/stocktrack'

substitutions:
  _PROJECT_ID: 'stocktrack-514813'
