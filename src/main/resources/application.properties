spring.application.name=backend

# =================================================================
# 🚀 H2 Embedded Database (Active - No XAMPP / MySQL needed!)
# -----------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:stocktrack_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (XAMPP Default - Commented out for testing)
# spring.datasource.url=jdbc:mysql://localhost:3306/stocktrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=

# Timezone & Session Configuration
spring.jackson.time-zone=Asia/Bangkok
server.servlet.session.timeout=30m

# Hibernate (JPA) Configuration
# update = Create tables automatically if they don't exist, and update them if models change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =================================================================
# 🆘 PLAN B: H2 Embedded Database (Use this if MySQL fails!)
# -----------------------------------------------------------------
# How to use:
# 1. Add '#' in front of the MySQL Configuration lines above.
# 2. Remove '#' from the H2 lines below.
# 3. Access H2 Console at: http://localhost:8080/h2-console
