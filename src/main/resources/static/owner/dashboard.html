<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Owner Dashboard</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="role-dashboard owner-dashboard">
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="OWNER" data-active-menu="dashboard"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1>Owner Executive Dashboard</h1>
                <p>Welcome back, Owner. High-level business metrics, executive approvals, and store insights.</p>
            </header>

            <section class="placeholder-card role-empty-state" aria-labelledby="owner-overview-title"><span class="role-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6M8 10h.01M16 10h.01"/></svg></span><div><p class="role-empty-eyebrow">OWNER WORKSPACE</p><h2 id="owner-overview-title">Executive overview</h2><p>Business summaries and reports are not connected in this workspace yet.</p></div></section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script>
        (function checkAccess() {
            const raw = localStorage.getItem('stocktrack_user');
            if (!raw) {
                window.location.replace('../index.html');
                return;
            }
            try {
                const user = JSON.parse(raw);
                if (!user || user.role !== 'OWNER') {
                    window.location.replace('../index.html');
                }
            } catch (err) {
                localStorage.removeItem('stocktrack_user');
                window.location.replace('../index.html');
            }
        })();
    </script>
</body>
</html>
