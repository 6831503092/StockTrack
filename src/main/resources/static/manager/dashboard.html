<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Manager Dashboard</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="MANAGER" data-active-menu="dashboard"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1>Manager Dashboard</h1>
                <p>Welcome back, Manager. Review and approve inventory requests and purchase orders.</p>
            </header>

            

             <!-- 3. Main Data Card: Table Container -->
            <section class="requests-card">
                <div class="requests-table-wrapper">
                    <table class="requests-table">
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Type</th>
                                <th>Requested by</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="requests-table-body">
                            <!-- Empty State: Ready for Backend API Data -->
                            <tr>
                                <td colspan="6" class="table-empty-state">
                                    <div class="empty-state-wrap">
                                        <div class="empty-state-icon-circle">
                                            <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                                stroke-linejoin="round">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z">
                                                </path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                                <polyline points="10 9 9 9 8 9"></polyline>
                                            </svg>
                                        </div>
                                        <p>ยังไม่มีข้อมูลคำขอในขณะนี้</p>
                                        <span class="empty-subtitle">ตารางนี้พร้อมสำหรับดึงข้อมูลคำขอ (Requests) จาก
                                            Backend API มาแสดงผล</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 4. Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="requests-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls">
                        <button type="button" class="btn-page" id="btn-requests-prev" disabled>&lt;</button>
                        <button type="button" class="btn-page active" id="btn-page-num">1</button>
                        <button type="button" class="btn-page" id="btn-requests-next" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script>
        (function checkAccess() {
            const raw = localStorage.getItem('stocktrack_user');
            if (!raw) {
                window.location.replace('../index.html');
                return;
            }
            try {
                const user = JSON.parse(raw);
                if (!user || user.role !== 'MANAGER') {
                    window.location.replace('../index.html');
                }
            } catch (err) {
                localStorage.removeItem('stocktrack_user');
                window.location.replace('../index.html');
            }
        })();
    </script>
</body>
</html>
