<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Manager Dashboard</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="MANAGER" data-active-menu="dashboard"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1>Manager Dashboard</h1>
                <p>Welcome back, Manager. Review and approve inventory requests and purchase orders.</p>
            </header>

            <section class="placeholder-card">
                <p style="color: #64748b;">Main content display area for Manager Dashboard</p>
            </section>
            <section class="po-card">
                <div class="card-header-flex">
                    <h2>Products Details</h2>

                    <div class="card-header-controls">
                        <div class="po-search-box w-260">
                            <input type="text" id="search-products" placeholder="Search product name or ID...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <button type="button" class="btn-create-po" id="btn-open-add-product-modal">
                            Add Product
                        </button>
                    </div>
                </div>

                <!-- Table View -->
                <div class="po-table-wrapper">
                    <table class="po-table">
                        <thead>
                            <tr>
                                <th>Product ID</th>
                                <th style="width: 76px; text-align: center;">Image</th>
                                <th>Product Name</th>
                                <th>Default Cost</th>
                                <th>Selling Price</th>
                                <th>Current Stock</th>
                                <th>Min Alert</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                        </tbody>
                    </table>
                </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script>
        (function checkAccess() {
            const raw = localStorage.getItem('stocktrack_user');
            if (!raw) {
                window.location.replace('../index.html');
                return;
            }
            try {
                const user = JSON.parse(raw);
                if (!user || user.role !== 'MANAGER') {
                    window.location.replace('../index.html');
                }
            } catch (err) {
                localStorage.removeItem('stocktrack_user');
                window.location.replace('../index.html');
            }
        })();
    </script>
</body>

</html>
