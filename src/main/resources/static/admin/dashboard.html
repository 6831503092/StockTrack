<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Admin Dashboard</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="role-dashboard admin-dashboard">
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="dashboard"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1>Admin Dashboard</h1>
                <p>Welcome back, Administrator. Manage users, inventory, and system orders.</p>
            </header>

            <section class="placeholder-card role-empty-state" aria-labelledby="admin-overview-title"><span class="role-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span><div><p class="role-empty-eyebrow">ADMIN WORKSPACE</p><h2 id="admin-overview-title">Administrative overview</h2><p>Dashboard summaries are not connected in this workspace yet.</p></div></section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script>
        (function checkAccess() {
            const raw = localStorage.getItem('stocktrack_user');
            if (!raw) {
                window.location.replace('../index.html');
                return;
            }
            try {
                const user = JSON.parse(raw);
                if (!user || user.role !== 'ADMIN') {
                    window.location.replace('../index.html');
                }
            } catch (err) {
                localStorage.removeItem('stocktrack_user');
                window.location.replace('../index.html');
            }
        })();
    </script>
</body>
</html>
