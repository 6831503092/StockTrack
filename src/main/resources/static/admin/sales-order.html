<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Sales Order</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="sales-order"></div>

        <!-- Main Content Area -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>Sales Order</h1>
                    <p>view and create sales orders</p>
                </div>

                <div class="requests-header-right">
                    <div class="po-create-btn-row">
                        <button type="button" class="btn-create-po" id="btn-open-create-so-modal">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Create Sales Order
                        </button>

                        <div class="requests-date-box" id="requests-date-box" title="Click to filter by date">
                            <span class="date-icon" id="date-picker-icon" title="Choose date">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </span>
                            <input type="date" id="requests-date-input" aria-label="Filter by date">
                            <button type="button" class="btn-clear-date" id="btn-clear-date" title="Clear date filter" style="display: none;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>

                            <!-- Custom Styled Date Picker Popup (StockTrack Mint Theme) -->
                            <div class="custom-calendar-popup" id="custom-calendar-popup" style="display: none;">
                                <div class="cal-header">
                                    <button type="button" class="cal-nav-btn" id="cal-prev-month" title="Previous month">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="15 18 9 12 15 6"></polyline>
                                        </svg>
                                    </button>
                                    <span class="cal-month-title" id="cal-month-title">November 2026</span>
                                    <button type="button" class="cal-nav-btn" id="cal-next-month" title="Next month">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <div class="cal-weekdays">
                                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                                </div>
                                <div class="cal-days-grid" id="cal-days-grid"></div>
                                <div class="cal-footer">
                                    <button type="button" class="cal-quick-btn" id="cal-btn-today">Today</button>
                                    <button type="button" class="cal-quick-btn cal-quick-clear" id="cal-btn-clear">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="po-header-filters-row">
                        <div class="po-search-box">
                            <input type="text" id="so-search-input" placeholder="search...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <select id="so-status-filter" class="po-status-select">
                            <option value="ALL">All status</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- 2. KPI / Summary Cards -->
            <section class="po-stats-grid">
                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Total Sales Orders</span>
                        <span class="stat-value mint" id="kpi-total-so">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Pending Approval</span>
                        <span class="stat-value amber" id="kpi-pending-so">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Approved Orders</span>
                        <span class="stat-value blue" id="kpi-approved-so">0</span>
                    </div>
                </div>
            </section>

            <!-- 3. Main Data Card: Table Container -->
            <section class="po-card">
                <div class="po-table-wrapper">
                    <table class="po-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>SO ID</th>
                                <th>Customer</th>
                                <th>Total Qty</th>
                                <th>Total Price</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="so-table-body">
                            
                        </tbody>
                    </table>
                </div>

                <!-- Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="so-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls">
                        <button type="button" class="btn-page" id="btn-prev-page" disabled>&lt;</button>
                        <button type="button" class="btn-page active">1</button>
                        <button type="button" class="btn-page" id="btn-next-page" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL: Create Sales Order Modal (Wireframe Reference Match) -->
    <div class="modal-overlay" id="modal-create-so">
        <div class="modal-box modal-po-wire">
            <div class="po-wire-header">
                <h2>Create Sales Order</h2>
                <button type="button" class="btn-close-modal" aria-label="Close modal">&times;</button>
            </div>

            <form id="form-create-so" onsubmit="handleCreateSOSubmit(event)">
                <!-- Row 1: Created by & UserID -->
                <div class="po-wire-grid-2">
                    <div>
                        <label for="new-so-created-by" class="po-wire-label">Created by</label>
                        <input type="text" id="new-so-created-by" class="po-wire-input-readonly" readonly placeholder="User Name">
                    </div>
                    <div>
                        <label for="new-so-user-id" class="po-wire-label">UserID</label>
                        <input type="text" id="new-so-user-id" class="po-wire-input-readonly" readonly placeholder="User ID">
                    </div>
                </div>

                <!-- Row 2: Customer -->
                <div class="po-wire-group">
                    <label for="new-so-customer" class="po-wire-label">Customer</label>
                    <select id="new-so-customer" class="po-wire-select">
                        <option value="" disabled selected></option>
                        <option value="RWTcomp.">RWTcomp.</option>
                        <option value="Office Pro Thailand">Office Pro Thailand</option>
                        <option value="Bangkok Modern Living">Bangkok Modern Living</option>
                        <option value="Siam Retail Group">Siam Retail Group</option>
                    </select>
                </div>

                <!-- Row 3: Product Items Section -->
                <div class="po-wire-items-section">
                    <div class="po-wire-items-header">
                        <span>Product name</span>
                        <span>Quantity</span>
                        <span>Unit price</span>
                        <span>Total price</span>
                    </div>

                    <div class="po-wire-items-list" id="so-items-container">
                        <div class="po-wire-item-row">
                            <select class="po-wire-select so-item-product" onchange="handleSOProductChange(this)">
                                <option value="" disabled selected></option>
                                <option value="Executive Chair" data-price="4500">Executive Chair</option>
                                <option value="Wooden Desk" data-price="6200">Wooden Desk</option>
                                <option value="L-Shape Sofa" data-price="16800">L-Shape Sofa</option>
                                <option value="Storage Cabinet" data-price="3900">Storage Cabinet</option>
                                <option value="Ergonomic Mesh Chair" data-price="3400">Ergonomic Mesh Chair</option>
                                <option value="Steel Filing Cabinet" data-price="2750">Steel Filing Cabinet</option>
                            </select>
                            <input type="number" min="1" class="po-wire-input so-item-qty" placeholder="" oninput="handleSOQtyChange(this)">
                            <input type="text" class="po-wire-input-readonly so-item-unit-price" readonly placeholder="">
                            <input type="text" class="po-wire-input-readonly so-item-total-price" readonly placeholder="">
                        </div>
                    </div>
                </div>

                <!-- Row 4: + Add Item / - Delete Item -->
                <div class="po-wire-item-actions">
                    <button type="button" class="po-wire-btn-text" id="btn-add-so-item" onclick="addSOItemRow()">+ Add Item</button>
                    <button type="button" class="po-wire-btn-text delete" id="btn-delete-so-item" onclick="deleteLastSOItemRow()">- Delete Item</button>
                </div>

                <!-- Row 5: Action Buttons -->
                <div class="po-wire-actions">
                    <button type="button" class="po-wire-btn-cancel" data-close-modal>Cancel</button>
                    <button type="submit" class="po-wire-btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        AdminApp.checkAdminAccess();

        const formatMoney = AdminApp.formatMoney;

        AdminApp.initCustomDatePicker({
            box: 'requests-date-box',
            onChange: (dateVal) => {
                // Ready for filtering when Backend API loads sales orders
            }
        });

        // --- Create SO Form Handlers (Wireframe UI Structure) ---
        function handleSOProductChange(selectEl) {
            const row = selectEl.closest('.po-wire-item-row');
            if (!row) return;

            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const price = parseFloat(selectedOption ? selectedOption.getAttribute('data-price') : 0) || 0;

            const unitPriceInput = row.querySelector('.so-item-unit-price');
            const qtyInput = row.querySelector('.so-item-qty');
            const totalPriceInput = row.querySelector('.so-item-total-price');

            unitPriceInput.value = price > 0 ? formatMoney(price) : '';
            unitPriceInput.dataset.price = price;

            if (!qtyInput.value) {
                qtyInput.value = '1';
            }

            const qty = parseInt(qtyInput.value, 10) || 0;
            const total = qty * price;
            totalPriceInput.value = total > 0 ? formatMoney(total) : '';
        }

        function handleSOQtyChange(qtyInput) {
            const row = qtyInput.closest('.po-wire-item-row');
            if (!row) return;

            const unitPriceInput = row.querySelector('.so-item-unit-price');
            const totalPriceInput = row.querySelector('.so-item-total-price');
            const price = parseFloat(unitPriceInput.dataset.price || 0);

            const qty = parseInt(qtyInput.value, 10) || 0;
            const total = qty * price;
            totalPriceInput.value = total > 0 ? formatMoney(total) : '';
        }

        function addSOItemRow() {
            const container = document.getElementById('so-items-container');
            const firstRow = container?.querySelector('.po-wire-item-row');
            if (!container || !firstRow) return;

            const newRow = firstRow.cloneNode(true);
            newRow.querySelectorAll('input').forEach(input => input.value = '');
            const select = newRow.querySelector('.so-item-product');
            if (select) {
                select.selectedIndex = 0;
                select.focus();
            }
            const unitPriceInput = newRow.querySelector('.so-item-unit-price');
            if (unitPriceInput) unitPriceInput.dataset.price = '0';
            container.appendChild(newRow);
        }

        function deleteLastSOItemRow() {
            const container = document.getElementById('so-items-container');
            if (!container) return;
            const rows = container.querySelectorAll('.po-wire-item-row');
            if (rows.length > 1) {
                rows[rows.length - 1].remove();
            } else if (rows.length === 1) {
                const row = rows[0];
                const select = row.querySelector('.so-item-product');
                if (select) select.selectedIndex = 0;
                row.querySelectorAll('input').forEach(input => input.value = '');
                const unit = row.querySelector('.so-item-unit-price');
                if (unit) unit.dataset.price = '0';
            }
        }

        function syncUserInfo() {
            const user = AdminApp.getCurrentUser();
            if (user) {
                const createdByEl = document.getElementById('new-so-created-by');
                const userIdEl = document.getElementById('new-so-user-id');
                if (createdByEl) createdByEl.value = user.fullName || user.username || '';
                if (userIdEl) userIdEl.value = user.userId || user.username || '';
            }
        }

        function openCreateSOModal() {
            syncUserInfo();
            AdminApp.openModal('modal-create-so');
        }

        function closeCreateSOModal() {
            AdminApp.closeModal('modal-create-so');
        }

        document.getElementById('btn-open-create-so-modal')?.addEventListener('click', openCreateSOModal);

        function handleCreateSOSubmit(e) {
            e.preventDefault();
            closeCreateSOModal();
        }

        syncUserInfo();
    </script>
</body>

</html>
