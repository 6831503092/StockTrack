<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Products Managements</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="zone-product"></div>

        <!-- Main Content Area -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>Products Managements</h1>
                    <p>search ,view and manage product information</p>
                </div>

                <div class="requests-header-right header-actions-inline">
                    <a href="zone-product.html" class="btn-back-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                </div>
            </header>

            <!-- 2. KPI Summary Cards Grid -->
            <section class="po-stats-grid">
                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Total Products</span>
                        <span class="stat-value mint" id="kpi-pm-total">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Stored Units</span>
                        <span class="stat-value blue" id="kpi-pm-units">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Low Stock</span>
                        <span class="stat-value amber" id="kpi-pm-low-stock">0</span>
                    </div>
                </div>
            </section>

            <!-- 3. Main Data Card: Products Details Table -->
            <section class="po-card">
                <div class="card-header-flex">
                    <h2>Products Details</h2>

                    <div class="card-header-controls">
                        <div class="po-search-box w-260">
                            <input type="text" id="search-products" placeholder="Search product name or ID...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <select id="select-pm-zone" class="po-status-select zone-select-lg">
                            <option value="ALL">Select Zone</option>
                            <option value="ZONE_A">Zone A</option>
                            <option value="ZONE_B">Zone B</option>
                            <option value="ZONE_C">Zone C</option>
                        </select>

                        <div class="requests-date-box" id="requests-date-box" title="Click to filter by date">
                            <span class="date-icon" id="date-picker-icon" title="Choose date">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </span>
                            <input type="date" id="requests-date-input" aria-label="Filter by date">
                            <button type="button" class="btn-clear-date" id="btn-clear-date" title="Clear date filter" style="display: none;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>

                            <!-- Custom Styled Date Picker Popup (StockTrack Mint Theme) -->
                            <div class="custom-calendar-popup" id="custom-calendar-popup" style="display: none;">
                                <div class="cal-header">
                                    <button type="button" class="cal-nav-btn" id="cal-prev-month" title="Previous month">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="15 18 9 12 15 6"></polyline>
                                        </svg>
                                    </button>
                                    <span class="cal-month-title" id="cal-month-title">November 2026</span>
                                    <button type="button" class="cal-nav-btn" id="cal-next-month" title="Next month">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <div class="cal-weekdays">
                                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                                </div>
                                <div class="cal-days-grid" id="cal-days-grid"></div>
                                <div class="cal-footer">
                                    <button type="button" class="cal-quick-btn" id="cal-btn-today">Today</button>
                                    <button type="button" class="cal-quick-btn cal-quick-clear" id="cal-btn-clear">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table View -->
                <div class="po-table-wrapper">
                    <table class="po-table">
                        <thead>
                            <tr>
                                <th>Product ID</th>
                                <th>Product Name</th>
                                <th>Default Cost</th>
                                <th>Selling Price</th>
                                <th>Current Stock</th>
                                <th>Min Alert</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            
                        </tbody>
                    </table>
                </div>

                <!-- Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="product-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls">
                        <button type="button" class="btn-page" id="btn-prev-page" disabled>&lt;</button>
                        <button type="button" class="btn-page active">1</button>
                        <button type="button" class="btn-page" id="btn-next-page" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        AdminApp.checkAdminAccess();

        AdminApp.initCustomDatePicker({
            box: 'requests-date-box',
            onChange: (dateVal) => {
                // Hooked up for filtering when Backend API loads products
            }
        });
    </script>
</body>

</html>
