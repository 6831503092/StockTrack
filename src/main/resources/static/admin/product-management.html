<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Products Managements</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="zone-product"></div>

        <!-- Main Content Area -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>Products Managements</h1>
                    <p>search ,view and manage product information</p>
                </div>

                <div class="requests-header-right header-actions-inline">
                    <a href="zone-product.html" class="btn-back-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                </div>
            </header>

            <!-- 2. KPI Summary Cards Grid -->
            <section class="po-stats-grid">
                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Total Products</span>
                        <span class="stat-value mint" id="kpi-pm-total">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Stored Units</span>
                        <span class="stat-value blue" id="kpi-pm-units">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Low Stock</span>
                        <span class="stat-value amber" id="kpi-pm-low-stock">0</span>
                    </div>
                </div>
            </section>

            <!-- 3. Main Data Card: Products Details Table -->
            <section class="po-card">
                <div class="card-header-flex">
                    <h2>Products Details</h2>

                    <div class="card-header-controls">
                        <div class="po-search-box w-260">
                            <input type="text" id="search-products" placeholder="Search product name or ID...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <select id="select-pm-zone" class="po-status-select zone-select-lg">
                            <option value="ALL">All Zones</option>
                        </select>
                    </div>
                </div>

                <!-- Table View -->
                <div class="po-table-wrapper">
                    <table class="po-table">
                        <thead>
                            <tr>
                                <th style="width: 110px;">Product ID</th>
                                <th>Product Name</th>
                                <th>Default Cost</th>
                                <th>Selling Price</th>
                                <th>Current Stock</th>
                                <th>Min Alert</th>
                                <th style="width: 100px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            <tr>
                                <td colspan="7" class="table-empty-state">
                                    <p class="empty-title">Loading products...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="product-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls" id="pm-pagination-controls">
                        <button type="button" class="btn-page" id="btn-prev-page" disabled>&lt;</button>
                        <span id="pagination-pages" style="display: inline-flex; gap: 4px;">
                            <button type="button" class="btn-page active">1</button>
                        </span>
                        <button type="button" class="btn-page" id="btn-next-page" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL: Product Details Modal -->
    <div class="modal-overlay" id="modal-product-detail">
        <div class="modal-box" style="max-width: 520px;">
            <div class="modal-header">
                <h3>Product Details</h3>
                <button type="button" class="btn-close-modal" onclick="closeProductDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="product-detail-modal-body">
                <!-- Dynamically populated -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeProductDetailModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        AdminApp.checkAdminAccess();

        const { escapeHtml, formatMoney, openModal, closeModal } = AdminApp;

        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        const pageSize = 10;

        const tbody = document.getElementById('products-table-body');
        const searchInput = document.getElementById('search-products');
        const selectZone = document.getElementById('select-pm-zone');
        const pageInfo = document.getElementById('product-pagination-info');
        const prevBtn = document.getElementById('btn-prev-page');
        const nextBtn = document.getElementById('btn-next-page');
        const pagesContainer = document.getElementById('pagination-pages');

        async function loadZones() {
            try {
                if (window.api && typeof window.api.get === 'function') {
                    const res = await window.api.get('/api/zones');
                    if (res && res.success && Array.isArray(res.data)) {
                        selectZone.innerHTML = `
                            <option value="ALL">All Zones</option>
                            ${res.data.map(z => `<option value="${escapeHtml(z.zoneCode)}">${escapeHtml(z.zoneName)}</option>`).join('')}
                        `;
                    }
                }
            } catch (err) {
                console.error('Failed to load zones:', err);
            }
        }

        async function loadProducts() {
            try {
                if (window.api && typeof window.api.get === 'function') {
                    const res = await window.api.get('/api/zones/products');
                    if (res && res.success && Array.isArray(res.data)) {
                        allProducts = res.data;
                    } else if (Array.isArray(res)) {
                        allProducts = res;
                    }
                }
            } catch (err) {
                console.error('Failed to load products from API:', err);
            } finally {
                applyFilter();
            }
        }

        function updateKPIs(data) {
            const list = Array.isArray(data) ? data : [];
            const total = list.length;
            const units = list.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
            const lowStock = list.filter(p => (Number(p.stock) || 0) <= (Number(p.minStockAlert) || 20)).length;

            document.getElementById('kpi-pm-total').textContent = total;
            document.getElementById('kpi-pm-units').textContent = units.toLocaleString('en-US');
            document.getElementById('kpi-pm-low-stock').textContent = lowStock;
        }

        function applyFilter() {
            const query = (searchInput?.value || '').toLowerCase().trim();
            const selectedZone = selectZone?.value || 'ALL';

            filteredProducts = allProducts.filter(p => {
                const matchZone = selectedZone === 'ALL' ||
                    String(p.location || '').toUpperCase() === selectedZone.toUpperCase() ||
                    String(p.zoneName || '').toUpperCase() === selectedZone.toUpperCase();

                const matchQuery = !query ||
                    String(p.id || '').includes(query) ||
                    String(p.name || '').toLowerCase().includes(query) ||
                    String(p.location || '').toLowerCase().includes(query) ||
                    String(p.zoneName || '').toLowerCase().includes(query);

                return matchZone && matchQuery;
            });

            currentPage = 1;
            renderTable();
            updateKPIs(filteredProducts);
        }

        function renderTable() {
            if (!filteredProducts || filteredProducts.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="table-empty-state">
                            <p class="empty-title">No products found</p>
                            <p class="empty-subtitle">Try adjusting your search keyword or selected warehouse zone</p>
                        </td>
                    </tr>
                `;
                pageInfo.textContent = 'Showing 0 of 0 entries';
                renderPagination(0);
                return;
            }

            const total = filteredProducts.length;
            const totalPages = Math.ceil(total / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, total);
            const pageItems = filteredProducts.slice(startIdx, endIdx);

            tbody.innerHTML = pageItems.map(p => {
                const isLow = (Number(p.stock) || 0) <= (Number(p.minStockAlert) || 20);
                const badgeClass = isLow ? 'badge-low-stock' : 'badge-in-stock';

                return `
                    <tr>
                        <td class="cell-id">#${escapeHtml(String(p.id))}</td>
                        <td>
                            <div style="font-weight: 600; color: #0f172a;">${escapeHtml(p.name)}</div>
                            <div class="cell-subtext">${escapeHtml(p.zoneName || p.location || '-')}</div>
                        </td>
                        <td>฿${formatMoney(p.defaultCost)}</td>
                        <td>฿${formatMoney(p.sellingPrice)}</td>
                        <td>
                            <span class="badge-status ${badgeClass}">
                                ${Number(p.stock || 0).toLocaleString()} Units
                            </span>
                        </td>
                        <td>${Number(p.minStockAlert || 20).toLocaleString()} Units</td>
                        <td>
                            <button type="button" class="btn-action-detail" onclick="viewProductDetail('${escapeHtml(String(p.id))}')">Detail</button>
                        </td>
                    </tr>
                `;
            }).join('');

            pageInfo.textContent = `Showing ${startIdx + 1} to ${endIdx} of ${total} entries`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages || totalPages === 0;

            if (totalPages <= 1) {
                pagesContainer.innerHTML = `<button type="button" class="btn-page active">1</button>`;
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button type="button" class="btn-page ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            pagesContainer.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        prevBtn?.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        nextBtn?.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredProducts.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        searchInput?.addEventListener('input', applyFilter);
        selectZone?.addEventListener('change', applyFilter);

        function viewProductDetail(productId) {
            const p = allProducts.find(item => String(item.id) === String(productId));
            if (!p) return;

            const isLow = (Number(p.stock) || 0) <= (Number(p.minStockAlert) || 20);
            const badgeClass = isLow ? 'badge-low-stock' : 'badge-in-stock';
            const statusLabel = isLow ? 'Low Stock' : 'In Stock';

            document.getElementById('product-detail-modal-body').innerHTML = `
                <div class="detail-header-row" style="margin-bottom: 18px;">
                    <div>
                        <span class="detail-id-label">Product ID</span>
                        <h4 class="detail-id-title">#${escapeHtml(String(p.id))}</h4>
                    </div>
                    <span class="badge-status ${badgeClass}">${statusLabel}</span>
                </div>

                <div class="detail-meta-grid">
                    <div class="detail-meta-item">
                        <span>Product Name</span>
                        <strong>${escapeHtml(p.name)}</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>Warehouse Zone</span>
                        <strong>${escapeHtml(p.zoneName || p.location || '-')}</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>Default Cost</span>
                        <strong>฿${formatMoney(p.defaultCost)}</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>Selling Price</span>
                        <strong>฿${formatMoney(p.sellingPrice)}</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>Current Stock</span>
                        <strong style="color: ${isLow ? '#b91c1c' : '#15803d'};">${Number(p.stock || 0).toLocaleString()} Units</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>Min Stock Alert</span>
                        <strong>${Number(p.minStockAlert || 20).toLocaleString()} Units</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>PO Min / Max Qty</span>
                        <strong>${p.poMinQty || 1} / ${p.poMaxQty != null ? p.poMaxQty : 'No Limit'}</strong>
                    </div>
                    <div class="detail-meta-item">
                        <span>SO Min / Max Qty</span>
                        <strong>${p.soMinQty || 1} / ${p.soMaxQty != null ? p.soMaxQty : 'No Limit'}</strong>
                    </div>
                </div>
            `;

            openModal('modal-product-detail');
        }

        function closeProductDetailModal() {
            closeModal('modal-product-detail');
        }

        // Initialize on load
        (async () => {
            await loadZones();
            await loadProducts();
        })();
    </script>
</body>

</html>
