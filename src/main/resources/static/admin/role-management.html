<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Role Management</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="role-management"></div>

        <!-- Main Content Area -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>Role Management</h1>
                    <p>View user roles, create new users, and manage account access</p>
                </div>

                <div class="requests-header-right">
                    <div class="po-create-btn-row">
                        <button type="button" class="btn-create-po" id="btn-open-create-user-modal">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <line x1="20" y1="8" x2="20" y2="14"></line>
                                <line x1="23" y1="11" x2="17" y2="11"></line>
                            </svg>
                            Create New User
                        </button>

                        <div class="requests-date-box" id="requests-date-box" title="Click to filter by date">
                            <input type="date" id="requests-date-input" aria-label="Filter by date">
                        </div>
                    </div>

                    <div class="po-header-filters-row">
                        <div class="po-search-box">
                            <input type="text" id="role-search-input" placeholder="Search by Full Name or ID...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <select id="role-filter-select" class="po-status-select">
                            <option value="ALL">All Roles</option>
                            <option value="Admin">Admin</option>
                            <option value="Manager">Manager</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- 2. KPI / Summary Cards -->
            <section class="po-stats-grid">
                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Total Users</span>
                        <span class="stat-value mint" id="kpi-total-users">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Admin Users</span>
                        <span class="stat-value blue" id="kpi-admin-users">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Staff Users</span>
                        <span class="stat-value amber" id="kpi-staff-users">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Manager Users</span>
                        <span class="stat-value purple" id="kpi-manager-users">0</span>
                    </div>
                </div>
            </section>

            <!-- 3. Main Data Card: User Role Table Container -->
            <section class="po-card">
                <div class="po-table-wrapper">
                    <table class="po-table">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Full Name</th>
                                <th>Current Role</th>
                                <th>Created At</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="role-table-body"></tbody>
                    </table>
                </div>

                <!-- Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="role-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls">
                        <button type="button" class="btn-page" id="btn-prev-page" disabled>&lt;</button>
                        <button type="button" class="btn-page active">1</button>
                        <button type="button" class="btn-page" id="btn-next-page" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL 1: Create New User Modal -->
    <div class="modal-overlay" id="modal-create-user">
        <div class="modal-box modal-md">
            <div class="modal-header">
                <h3>Create New User</h3>
                <button type="button" class="btn-close-modal">&times;</button>
            </div>
            <form id="form-create-user" onsubmit="handleCreateUserSubmit(event)">
                <div class="modal-body">
                    <div class="modal-field-mb">
                        <label for="new-fullname">Full Name</label>
                        <input type="text" id="new-fullname" class="modal-input" required>
                    </div>

                    <div class="modal-grid-2-sm modal-field-mb">
                        <div>
                            <label for="new-role">Role</label>
                            <select id="new-role" class="modal-input" required>
                                <option value="STAFF">Staff</option>
                                <option value="ADMIN">Admin</option>
                                <option value="MANAGER">Manager</option>
                            </select>
                        </div>
                        <div>
                            <label for="new-password">Password</label>
                            <input type="password" id="new-password" name="new-user-password" class="modal-input" required autocomplete="one-time-code" data-lpignore="true" data-1p-ignore="true" spellcheck="false">
                        </div>
                    </div>

                    <div class="modal-field-mb">
                        <label for="new-reason">Reason</label>
                        <textarea id="new-reason" class="modal-textarea" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" data-close-modal>Cancel</button>
                    <button type="submit" class="btn-submit">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Change / Request Role Modal -->
    <div class="modal-overlay" id="modal-change-role">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-role-title">Change User Role</h3>
                <button type="button" class="btn-close-modal">&times;</button>
            </div>
            <form id="form-change-role" onsubmit="handleChangeRoleSubmit(event)">
                <div class="modal-body">
                    <div class="modal-grid-2">
                        <div>
                            <label for="modal-user-id">User ID</label>
                            <input type="text" id="modal-user-id" class="modal-input" readonly>
                        </div>
                        <div>
                            <label for="modal-current-role">Current Role</label>
                            <input type="text" id="modal-current-role" class="modal-input" readonly>
                        </div>
                    </div>

                    <div class="modal-field-mt">
                        <label for="modal-user-name">User Full Name</label>
                        <input type="text" id="modal-user-name" class="modal-input" readonly>
                    </div>

                    <div class="modal-field-mt">
                        <label for="modal-new-role">Requested New Role</label>
                        <select id="modal-new-role" class="modal-input" required>
                            <option value="Admin">Admin</option>
                            <option value="Staff">Staff</option>
                            <option value="Manager">Manager</option>
                        </select>
                    </div>

                    <div class="modal-field-mt">
                        <label for="modal-role-reason">Reason for Role Change</label>
                        <textarea id="modal-role-reason" class="modal-textarea" rows="2" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" data-close-modal>Cancel</button>
                    <button type="submit" class="btn-submit">Submit Change</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        AdminApp.checkAdminAccess();

        const searchInput = document.getElementById('role-search-input');
        const roleFilterSelect = document.getElementById('role-filter-select');
        const paginationInfo = document.getElementById('role-pagination-info');
        const tableBody = document.getElementById('role-table-body');
        let currentUsers = [];

        const ROLE_META = {
            ADMIN: { roleClass: 'role-admin', roleLabel: 'Admin' },
            MANAGER: { roleClass: 'role-manager', roleLabel: 'Manager' },
            STAFF: { roleClass: 'role-staff', roleLabel: 'Staff' }
        };

        AdminApp.initCustomDatePicker({
            box: 'requests-date-box',
            onChange: filterRoles
        });

        async function loadUsers() {
            try {
                const res = await window.api.get('/api/users');
                currentUsers = res?.data || [];
                renderKPIs(currentUsers);
                renderUserTable(currentUsers);
            } catch (err) {
                console.error('Failed to load users:', err);
                tableBody.innerHTML = '';
                paginationInfo.textContent = 'Showing 0 of 0 entries';
            }
        }

        function getVisibleUsers(users) {
            return (users || []).filter(u => (u.role || '').toUpperCase() !== 'OWNER');
        }

        function renderKPIs(users) {
            const visible = getVisibleUsers(users);
            const countByRole = (role) => visible.filter(u => (u.role || '').toUpperCase() === role).length;

            document.getElementById('kpi-total-users').textContent = visible.length;
            document.getElementById('kpi-admin-users').textContent = countByRole('ADMIN');
            document.getElementById('kpi-staff-users').textContent = countByRole('STAFF');
            document.getElementById('kpi-manager-users').textContent = countByRole('MANAGER');
        }

        function renderUserTable(users) {
            const visibleUsers = getVisibleUsers(users);

            if (!visibleUsers.length) {
                tableBody.innerHTML = '';
                paginationInfo.textContent = 'Showing 0 of 0 entries';
                return;
            }

            const currentUser = window.api.getCurrentUser() || {};

            tableBody.innerHTML = visibleUsers.map(user => {
                const roleUpper = (user.role || '').toUpperCase();
                const { roleClass, roleLabel } = ROLE_META[roleUpper] || ROLE_META.STAFF;
                const isSelf = currentUser && currentUser.userId === user.userId;
                const safeName = AdminApp.escapeHtml(user.fullName || '');

                const actionHtml = isSelf
                    ? '<span class="cell-subtext">Current User</span>'
                    : `<button type="button" class="btn-change-role-action" onclick="openChangeRoleModal(${user.userId}, '${safeName}', '${roleLabel}')">Change Role</button>`;

                return `
                    <tr class="role-row" data-user-id="${user.userId}" data-user-name="${safeName}" data-role="${roleLabel}">
                        <td class="cell-bold">${user.userId}</td>
                        <td><div>${AdminApp.escapeHtml(user.fullName || '-')}</div></td>
                        <td><span class="badge-role ${roleClass}">${roleLabel}</span></td>
                        <td class="cell-subtext">-</td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            }).join('');

            filterRoles();
        }

        function openCreateUserModal() {
            document.getElementById('form-create-user').reset();
            AdminApp.openModal('modal-create-user');
        }

        function closeCreateUserModal() {
            AdminApp.closeModal('modal-create-user');
        }

        document.getElementById('btn-open-create-user-modal')?.addEventListener('click', openCreateUserModal);

        async function handleCreateUserSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('new-fullname').value.trim();
            const role = document.getElementById('new-role').value;
            const password = document.getElementById('new-password').value;
            const reason = document.getElementById('new-reason').value.trim();

            try {
                const res = await window.api.post('/api/requests/user-create', { fullName, role, password, reason });
                closeCreateUserModal();
                loadUsers();

                AdminApp.showCenterAlert({
                    title: 'Request Submitted!',
                    message: res.message || `User creation request for "${fullName}" submitted successfully for approval.`,
                    type: 'success'
                });
            } catch (err) {
                AdminApp.showCenterAlert({
                    title: 'Failed to Submit',
                    message: err.message || 'Failed to submit user creation request',
                    type: 'error'
                });
            }
        }

        function openChangeRoleModal(userId, userName, currentRole) {
            document.getElementById('modal-role-title').textContent = 'Change User Role';
            document.getElementById('modal-user-id').value = userId;
            document.getElementById('modal-user-name').value = userName;
            document.getElementById('modal-current-role').value = currentRole;
            document.getElementById('modal-role-reason').value = '';
            document.getElementById('modal-new-role').value = currentRole === 'Staff' ? 'Manager' : 'Staff';

            AdminApp.openModal('modal-change-role');
        }

        function closeChangeRoleModal() {
            AdminApp.closeModal('modal-change-role');
        }

        async function handleChangeRoleSubmit(e) {
            e.preventDefault();
            const userId = parseInt(document.getElementById('modal-user-id').value, 10);
            const userName = document.getElementById('modal-user-name').value || 'User';
            const newRole = document.getElementById('modal-new-role').value;
            const reason = document.getElementById('modal-role-reason').value.trim();

            try {
                const res = await window.api.post('/api/requests/role-change', { userId, newRole, reason });
                closeChangeRoleModal();

                AdminApp.showCenterAlert({
                    title: 'Request Submitted!',
                    message: res.message || `Role change request for ${userName} to ${newRole} submitted successfully for approval.`,
                    type: 'success'
                });
            } catch (err) {
                AdminApp.showCenterAlert({
                    title: 'Failed to Submit',
                    message: err.message || 'Failed to submit role change request',
                    type: 'error'
                });
            }
        }

        function filterRoles() {
            const rows = document.querySelectorAll('.role-row');
            if (!rows.length) {
                paginationInfo.textContent = 'Showing 0 of 0 entries';
                return;
            }

            const query = searchInput.value.toLowerCase().trim();
            const selectedRole = roleFilterSelect.value;
            let visibleCount = 0;

            rows.forEach(row => {
                const uid = (row.getAttribute('data-user-id') || '').toLowerCase();
                const uname = (row.getAttribute('data-user-name') || '').toLowerCase();
                const urole = (row.getAttribute('data-role') || '').toLowerCase();

                const isMatch = (!query || uid.includes(query) || uname.includes(query)) &&
                    (selectedRole === 'ALL' || urole === selectedRole.toLowerCase());

                row.style.display = isMatch ? '' : 'none';
                if (isMatch) visibleCount++;
            });

            paginationInfo.textContent = `Showing ${visibleCount} of ${rows.length} entries`;
        }

        searchInput.addEventListener('input', filterRoles);
        roleFilterSelect.addEventListener('change', filterRoles);

        loadUsers();
    </script>
</body>

</html>
