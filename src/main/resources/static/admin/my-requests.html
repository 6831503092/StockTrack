<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - My Requests</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="my-requests"></div>

        <!-- Main Content Area (Full Height Layout) -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>My requests</h1>
                    <p>view your request and track their status</p>
                </div>

                <div class="requests-header-right">
                    <div class="requests-filter-bar">
                        <div class="requests-search-box">
                            <input type="text" id="requests-search-input" placeholder="Search Request ID, type, requester...">
                            <span class="search-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                        </div>

                        <div class="requests-date-box" id="requests-date-box" title="Click to filter by date">
                            <input type="date" id="requests-date-input" aria-label="Filter by date">
                        </div>
                    </div>

                    <div class="requests-tabs-row">
                        <div class="requests-status-tabs" id="requests-tabs">
                            <button type="button" class="tab-pill active" data-status="ALL">All</button>
                            <button type="button" class="tab-pill" data-status="Pending">Pending</button>
                            <button type="button" class="tab-pill" data-status="Approved">Approved</button>
                            <button type="button" class="tab-pill" data-status="Rejected">Rejected</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 2. KPI Summary Cards -->
            <section class="po-stats-grid">
                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Total Requests</span>
                        <span class="stat-value mint" id="kpi-req-total">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Pending Review</span>
                        <span class="stat-value amber" id="kpi-req-pending">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Approved Requests</span>
                        <span class="stat-value mint" id="kpi-req-approved">0</span>
                    </div>
                </div>

                <div class="po-stat-card">
                    <div class="po-stat-info">
                        <span class="stat-label">Rejected Requests</span>
                        <span class="stat-value red" id="kpi-req-rejected">0</span>
                    </div>
                </div>
            </section>

            <!-- 3. Main Data Card: Table Container -->
            <section class="requests-card">
                <div class="requests-table-wrapper">
                    <table class="requests-table">
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Type</th>
                                <th>Requested by</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="requests-table-body"></tbody>
                    </table>
                </div>

                <!-- 4. Table Footer / Pagination -->
                <div class="po-pagination">
                    <span id="requests-pagination-info">Showing 0 of 0 entries</span>
                    <div class="pagination-controls">
                        <button type="button" class="btn-page" id="btn-requests-prev" disabled>&lt;</button>
                        <button type="button" class="btn-page active" id="btn-page-num">1</button>
                        <button type="button" class="btn-page" id="btn-requests-next" disabled>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL: Request Details Modal -->
    <div class="modal-overlay" id="modal-req-detail">
        <div class="modal-box modal-transfer-box">
            <div class="modal-header">
                <h3>Request Details</h3>
                <button type="button" class="btn-close-modal">&times;</button>
            </div>
            <div class="modal-body" id="req-detail-modal-body">
                <!-- Dynamically filled by JS -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-close-modal>Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        AdminApp.checkAdminAccess();

        const {
            escapeHtml,
            formatMoney,
            formatDisplayDate,
            formatDisplayStatus,
            getStatusBadgeClass,
            getProductImageUrl,
            matchesDateFilter,
            openModal,
            closeModal
        } = AdminApp;

        let requestsData = [];
        let currentFilterStatus = 'ALL';

        const requestsTbody = document.getElementById('requests-table-body');
        const dateInput = document.getElementById('requests-date-input');
        const searchInput = document.getElementById('requests-search-input');

        function renderRequestsTable(items) {
            const pageInfo = document.getElementById('requests-pagination-info');

            if (!items?.length) {
                requestsTbody.innerHTML = '';
                pageInfo.textContent = 'Showing 0 of 0 entries';
                updateKPIs(requestsData);
                return;
            }

            requestsTbody.innerHTML = items.map(req => {
                const badgeClass = getStatusBadgeClass(req.status);
                const rawId = req.requestId ?? req.id;
                const reqId = rawId !== undefined && rawId !== null ? ('#' + rawId) : '-';
                const reqType = req.type || req.requestType || 'Request';
                const requestedBy = req.requestedByName || req.requesterName || req.requestedBy || '-';
                const role = req.role || 'Admin';
                const displayDate = formatDisplayDate(req.date || req.requestedDatetime || req.createdAt);
                const displayStatus = formatDisplayStatus(req.status);
                const detailId = String(rawId || '');
                const isRejected = String(req.status || '').toUpperCase() === 'REJECTED';

                return `
                    <tr>
                        <td class="cell-id">${escapeHtml(reqId)}</td>
                        <td class="cell-medium">${escapeHtml(reqType)}</td>
                        <td>
                            <div><strong>${escapeHtml(requestedBy)}</strong></div>
                            <div class="cell-subtext">(${escapeHtml(role)})</div>
                        </td>
                        <td>${escapeHtml(displayDate)}</td>
                        <td><span class="badge-status ${badgeClass}">${escapeHtml(displayStatus)}</span></td>
                        <td>
                            <div class="action-buttons-group">
                                <button type="button" class="btn-action-detail" onclick="viewRequestDetail('${escapeHtml(detailId)}')">Detail</button>
                                ${isRejected ? `
                                    <button type="button" class="btn-action-reason" onclick="viewRejectionReason('${escapeHtml(detailId)}')" title="View reason for rejection">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="12"></line>
                                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                        </svg>
                                        Reason
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            pageInfo.textContent = `Showing 1 to ${items.length} of ${items.length} entries`;
            updateKPIs(requestsData);
        }

        function updateKPIs(data) {
            const list = Array.isArray(data) ? data : [];
            const countStatus = (target) => list.filter(d => String(d.status || '').toUpperCase() === target).length;

            document.getElementById('kpi-req-total').textContent = list.length;
            document.getElementById('kpi-req-pending').textContent = countStatus('PENDING');
            document.getElementById('kpi-req-approved').textContent = countStatus('APPROVED');
            document.getElementById('kpi-req-rejected').textContent = countStatus('REJECTED');
        }

        function applyRequestsFilter() {
            const query = (searchInput?.value || '').toLowerCase().trim();
            const selectedDate = dateInput ? dateInput.value : '';

            const filtered = requestsData.filter(req => {
                const reqStatusUpper = String(req.status || '').toUpperCase();
                const matchesStatus = (currentFilterStatus === 'ALL') || (reqStatusUpper === currentFilterStatus.toUpperCase());
                const matchesQuery = !query ||
                    String(req.requestId || req.id || '').toLowerCase().includes(query) ||
                    String(req.type || req.requestType || '').toLowerCase().includes(query) ||
                    String(req.requestedByName || req.requesterName || '').toLowerCase().includes(query) ||
                    String(req.detail || '').toLowerCase().includes(query);
                const matchesDate = matchesDateFilter(req.date || req.requestedDatetime || req.createdAt, selectedDate);

                return matchesStatus && matchesQuery && matchesDate;
            });
            renderRequestsTable(filtered);
        }

        document.getElementById('requests-tabs')?.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-pill');
            if (!btn) return;
            document.querySelectorAll('#requests-tabs .tab-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilterStatus = btn.getAttribute('data-status');
            applyRequestsFilter();
        });

        searchInput?.addEventListener('input', applyRequestsFilter);
        document.getElementById('btn-refresh-data')?.addEventListener('click', loadMyRequests);

        AdminApp.initCustomDatePicker({
            box: 'requests-date-box',
            onChange: applyRequestsFilter
        });

        async function loadMyRequests() {
            try {
                const res = await window.api?.get('/api/requests/my');
                if (res?.success && Array.isArray(res.data)) {
                    requestsData = res.data;
                } else if (Array.isArray(res)) {
                    requestsData = res;
                }
            } catch (err) {
                console.info('Requests API endpoint not yet connected or returned empty, rendering empty state:', err.message);
            } finally {
                applyRequestsFilter();
            }
        }

        function renderTransferSection(headingText, products, defaultFromZone, defaultToZone, destHeader, marginTop = '18px') {
            if (!products?.length) return '';
            return `
                <div style="margin-top: ${marginTop};">
                    <div style="margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: #334155;">
                        ${headingText}
                    </div>
                    <div class="modal-transfer-table-wrapper" style="max-height: 180px; overflow-y: auto;">
                        <table class="modal-transfer-table">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">Image</th>
                                    <th style="width: 80px;">Product ID</th>
                                    <th>Product Name</th>
                                    <th style="width: 90px;">Location</th>
                                    <th style="width: 100px;">${destHeader}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${products.map(p => {
                                    const pName = p.productName || p.name;
                                    const imgUrl = getProductImageUrl(pName, p.fromZoneCode || defaultFromZone);
                                    return `
                                        <tr>
                                            <td style="width: 50px; padding: 4px;">
                                                <img src="${escapeHtml(imgUrl)}" class="transfer-thumb-img" onerror="this.src='../picture/favicon/favicon.png'">
                                            </td>
                                            <td class="font-medium">${escapeHtml(String(p.productId || p.id))}</td>
                                            <td class="font-medium">${escapeHtml(pName)}</td>
                                            <td>${escapeHtml(p.fromZoneCode || defaultFromZone)}</td>
                                            <td class="transfer-dest-cell" style="font-weight: 600; color: #0d9488;">${escapeHtml(p.toZoneCode || defaultToZone)}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function viewRejectionReason(id) {
            const req = requestsData.find(r => String(r.requestId || r.id) === String(id));
            if (!req) return;

            AdminApp.showRejectionModal({
                title: 'Reason for Rejection',
                requestId: req.requestId ?? req.id,
                requestType: req.type || req.requestType || 'Request',
                date: req.date || req.requestedDatetime || req.createdAt,
                rejectedBy: req.decidedByName || 'Manager',
                rejectedDatetime: req.decidedDatetime,
                reason: req.decisionReason || 'No specific reason provided by manager.',
                onViewDetail: () => viewRequestDetail(id)
            });
        }

        function viewRequestDetail(id) {
            const req = requestsData.find(r => String(r.requestId || r.id) === String(id));
            if (!req) return;

            const badgeClass = getStatusBadgeClass(req.status);
            const rawId = req.requestId ?? req.id;
            const reqId = rawId !== undefined && rawId !== null ? ('#' + rawId) : id;
            const reqType = req.type || req.requestType || 'Request';
            const displayDate = formatDisplayDate(req.date || req.requestedDatetime || req.createdAt);
            const displayStatus = formatDisplayStatus(req.status);
            const requestedBy = req.requestedByName || req.requesterName || req.requestedBy || '-';
            const role = req.role || 'Admin';
            const detailText = req.detail || req.note || 'No additional detail specified.';

            let decisionInfo = '';
            const statusUpper = String(req.status || '').toUpperCase();
            if (statusUpper === 'REJECTED') {
                const deciderText = req.decidedByName
                    ? `<div style="font-size: 0.82rem; color: #9b2c2c; margin-top: 6px;">Reviewed by: <strong>${escapeHtml(req.decidedByName)}</strong> on ${formatDisplayDate(req.decidedDatetime)}</div>`
                    : '';
                decisionInfo = `
                    <div class="detail-note-box warning-box" style="margin-top: 14px; background: #fff5f5; border: 1px solid #fed7d7; padding: 12px; border-radius: 8px;">
                        <strong style="color: #c53030;">Reason for Rejection:</strong>
                        <p style="color: #742a2a; margin-top: 4px; margin-bottom: 0;">${escapeHtml(req.decisionReason || 'No reason specified')}</p>
                        ${deciderText}
                    </div>
                `;
            } else if (statusUpper === 'APPROVED' && req.decidedByName) {
                decisionInfo = `
                    <div class="detail-note-box" style="margin-top: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 8px;">
                        <strong style="color: #166534;">Approval Information:</strong>
                        <p style="color: #15803d; margin-top: 4px; margin-bottom: 0;">Approved by: <strong>${escapeHtml(req.decidedByName)}</strong> on ${formatDisplayDate(req.decidedDatetime)}</p>
                    </div>
                `;
            }

            let payload = null;
            if (req.payload) {
                try {
                    payload = typeof req.payload === 'string' ? JSON.parse(req.payload) : req.payload;
                } catch {
                    payload = null;
                }
            }

            const typeUpper = String(reqType).toUpperCase();
            let extraGridHtml = '';
            let productTablesHtml = '';
            let reasonText = '';

            if (typeUpper === 'USER_CREATE') {
                let targetFullName = payload?.fullName;
                let targetUserId = payload?.userId || payload?.numericUserId || req.targetId;
                let targetRole = payload?.role;
                reasonText = payload?.reason;

                if (!targetFullName || !reasonText) {
                    const match = detailText.match(/Create new user:\s*(.*?)\s*\((?:ID:\s*)?(\d+),\s*Role:\s*([A-Za-z0-9_]+)\)\.\s*(?:Reason:\s*(.*))?/i);
                    if (match) {
                        targetFullName = targetFullName || match[1];
                        targetUserId = targetUserId || match[2];
                        targetRole = targetRole || match[3];
                        reasonText = reasonText || match[4];
                    }
                }

                if (!reasonText && detailText.includes('Reason:')) {
                    reasonText = detailText.split(/Reason:\s*/i)[1];
                }
                reasonText = reasonText || 'Account creation request';

                const roleClass = targetRole ? `role-${targetRole.toLowerCase()}` : '';
                extraGridHtml = `
                    <div>
                        <span>Assigned Role</span>
                        <strong>${targetRole ? `<span class="badge-role ${roleClass}">${escapeHtml(targetRole)}</span>` : '-'}</strong>
                    </div>
                    <div>
                        <span>New User Name</span>
                        <strong>${escapeHtml(targetFullName || '-')}</strong>
                    </div>
                    <div>
                        <span>Assigned User ID</span>
                        <strong>${escapeHtml(String(targetUserId || '-'))}</strong>
                    </div>
                `;
            } else if (typeUpper === 'ROLE_CHANGE') {
                let targetFullName = payload?.fullName;
                let targetUserId = payload?.userId || req.targetId;
                let currentRole = payload?.currentRole;
                let newRole = payload?.newRole;
                reasonText = payload?.reason;

                if (!targetFullName || !newRole) {
                    const match = detailText.match(/Change role:\s*(.*?)\s*\(([A-Za-z0-9_]+)\s*->\s*([A-Za-z0-9_]+)\)/i);
                    if (match) {
                        targetFullName = targetFullName || match[1];
                        currentRole = currentRole || match[2];
                        newRole = newRole || match[3];
                    }
                }

                if (!reasonText && detailText.includes('Reason:')) {
                    reasonText = detailText.split(/Reason:\s*/i)[1];
                }
                reasonText = reasonText || 'Role change request';

                extraGridHtml = `
                    <div>
                        <span>Target User</span>
                        <strong>${escapeHtml(targetFullName || '-')} ${targetUserId ? `(#${escapeHtml(String(targetUserId))})` : ''}</strong>
                    </div>
                    <div>
                        <span>Current Role</span>
                        <strong>${currentRole ? `<span class="badge-role role-${currentRole.toLowerCase()}">${escapeHtml(currentRole)}</span>` : '-'}</strong>
                    </div>
                    <div>
                        <span>New Role</span>
                        <strong>${newRole ? `<span class="badge-role role-${newRole.toLowerCase()}">${escapeHtml(newRole)}</span>` : '-'}</strong>
                    </div>
                `;
            } else if (typeUpper === 'PRODUCT_MOVE') {
                let sourceZoneCode = payload?.sourceZoneCode || payload?.sourceZone || '';
                let targetZoneCode = payload?.targetZoneCode || payload?.targetZone || '';
                const sourceZoneName = payload?.sourceZoneName || '';
                const targetZoneName = payload?.targetZoneName || '';

                if (!sourceZoneCode || !targetZoneCode) {
                    const match = detailText.match(/Zone\s*([A-Za-z0-9_]+).*?(?:<->|->)\s*Zone\s*([A-Za-z0-9_]+)/i);
                    if (match) {
                        sourceZoneCode = sourceZoneCode || match[1];
                        targetZoneCode = targetZoneCode || match[2];
                    }
                }

                sourceZoneCode = sourceZoneCode || 'Z1';
                targetZoneCode = targetZoneCode || 'Z2';

                const formatZoneDisplay = (code, name) => {
                    if (name && name.startsWith('Zone')) return name;
                    if (code && /^Z\d+/i.test(code)) return `Zone ${code.replace(/^Z/i, '')}`;
                    return name || code || 'Zone 1';
                };

                const srcDisplay = formatZoneDisplay(sourceZoneCode, sourceZoneName);
                const tgtDisplay = formatZoneDisplay(targetZoneCode, targetZoneName);

                const isSwap = payload?.operation === 'ZONE_SWAP' ||
                    Boolean(payload?.targetProducts?.length) ||
                    detailText.includes('<->');

                const transferTypeLabel = isSwap
                    ? `Zone Swap (${srcDisplay} to ${tgtDisplay})`
                    : `Zone Move (${srcDisplay} to ${tgtDisplay})`;

                extraGridHtml = `
                    <div>
                        <span>Transfer Type</span>
                        <strong>${escapeHtml(transferTypeLabel)}</strong>
                    </div>
                `;

                const sourceProducts = Array.isArray(payload?.sourceProducts)
                    ? payload.sourceProducts
                    : (Array.isArray(payload?.products) ? payload.products : []);
                const targetProducts = Array.isArray(payload?.targetProducts) ? payload.targetProducts : [];

                productTablesHtml += renderTransferSection(
                    `Products to be transferred (${sourceProducts.length} items):`,
                    sourceProducts,
                    sourceZoneCode,
                    targetZoneCode,
                    'Move to',
                    '18px'
                );

                productTablesHtml += renderTransferSection(
                    `Products swapped to ${escapeHtml(sourceZoneName)} (${targetProducts.length} items):`,
                    targetProducts,
                    targetZoneCode,
                    sourceZoneCode,
                    'Swap to',
                    '14px'
                );

                const rawReason = payload?.reason || '';
                const isDefaultReason = rawReason.startsWith('Swap zones') || rawReason.startsWith('Transfer entire Zone');
                reasonText = (rawReason && !isDefaultReason) ? rawReason : '';
            } else if (typeUpper === 'PO_CREATE' || typeUpper === 'SO_CREATE') {
                const isPO = typeUpper === 'PO_CREATE';
                const orderId = (isPO ? payload?.poId : payload?.soId) || req.targetId;
                const partnerLabel = isPO ? 'Supplier' : 'Customer';
                const partnerName = (isPO ? payload?.supplierName : payload?.customerName) || '-';
                const priceColTitle = isPO ? 'Unit Cost' : 'Unit Price';
                const totalAmount = payload?.totalPrice || payload?.totalAmount || 0;
                const totalQty = payload?.totalQuantity || payload?.totalQty || 0;
                const items = payload?.items || [];

                extraGridHtml = `
                    <div>
                        <span>${isPO ? 'PO ID' : 'SO ID'}</span>
                        <strong>#${escapeHtml(String(orderId || '-'))}</strong>
                    </div>
                    <div>
                        <span>${partnerLabel}</span>
                        <strong>${escapeHtml(partnerName)}</strong>
                    </div>
                    <div>
                        <span>Total Items</span>
                        <strong>${totalQty} items (฿${formatMoney(totalAmount)})</strong>
                    </div>
                `;

                if (items.length > 0) {
                    productTablesHtml = `
                        <div style="margin-top: 14px;">
                            <span style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 8px;">
                                Order Items (${items.length} item${items.length > 1 ? 's' : ''}):
                            </span>
                            <div class="modal-transfer-table-wrapper" style="max-height: 180px; overflow-y: auto;">
                                <table class="modal-transfer-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 50px;">Image</th>
                                            <th style="width: 80px;">Product ID</th>
                                            <th>Product Name</th>
                                            <th style="width: 70px;">Qty</th>
                                            <th style="width: 100px;">${priceColTitle}</th>
                                            <th style="width: 110px;">Subtotal</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${items.map(it => {
                                            const pName = it.productName || it.name || '-';
                                            const imgUrl = it.imageUrl || getProductImageUrl(pName, it.zoneCode);
                                            const qty = it.quantity || it.qty || 1;
                                            const unitVal = isPO ? (it.unitCost || it.unitPrice || 0) : (it.unitPrice || 0);
                                            const subtotal = it.subtotal || (qty * unitVal);
                                            return `
                                                <tr>
                                                    <td style="width: 50px; padding: 4px;">
                                                        <img src="${escapeHtml(imgUrl)}" class="transfer-thumb-img" onerror="this.src='../picture/favicon/favicon.png'">
                                                    </td>
                                                    <td class="font-medium">${escapeHtml(String(it.productId || '-'))}</td>
                                                    <td class="font-medium">${escapeHtml(pName)}</td>
                                                    <td>${qty}</td>
                                                    <td>฿${formatMoney(unitVal)}</td>
                                                    <td style="font-weight: 600; color: #0d9488;">฿${formatMoney(subtotal)}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
                reasonText = payload?.note || '';
            } else if (typeUpper === 'PRODUCT_UPDATE') {
                const prodId = payload?.productId || req.targetId || '-';
                const prodName = payload?.productName || '-';
                const oldName = payload?.oldProductName;
                const sellingPrice = payload?.sellingPrice;
                const oldPrice = payload?.oldSellingPrice;
                const currentStock = payload?.currentStock;
                const oldStock = payload?.oldCurrentStock;
                const cost = payload?.defaultCost;
                const zoneCode = payload?.zoneCode || '-';
                const imgUrl = getProductImageUrl(prodName, zoneCode);

                extraGridHtml = `
                    <div>
                        <span>Product ID</span>
                        <strong>#${escapeHtml(String(prodId))}</strong>
                    </div>
                    <div>
                        <span>Product Name</span>
                        <strong>${escapeHtml(prodName)} ${oldName && oldName !== prodName ? `<span style="font-size: 0.8rem; color: #94a3b8; font-weight: normal;">(was ${escapeHtml(oldName)})</span>` : ''}</strong>
                    </div>
                    <div>
                        <span>Selling Price</span>
                        <strong>฿${formatMoney(sellingPrice || 0)} ${oldPrice && oldPrice !== sellingPrice ? `<span style="font-size: 0.8rem; color: #94a3b8; font-weight: normal;">(was ฿${formatMoney(oldPrice)})</span>` : ''}</strong>
                    </div>
                    <div>
                        <span>Current Stock</span>
                        <strong>${Number(currentStock || 0).toLocaleString()} Units ${oldStock !== undefined && oldStock !== currentStock ? `<span style="font-size: 0.8rem; color: #94a3b8; font-weight: normal;">(was ${Number(oldStock).toLocaleString()})</span>` : ''}</strong>
                    </div>
                `;

                productTablesHtml = `
                    <div style="margin-top: 14px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(prodName)}" style="width: 58px; height: 42px; object-fit: contain; border-radius: 4px;" onerror="this.src='../picture/favicon/favicon.png'">
                        <div>
                            <div style="font-weight: 700; color: #0f172a; font-size: 0.95rem;">${escapeHtml(prodName)}</div>
                            <div style="font-size: 0.82rem; color: #64748b;">Cost: ฿${formatMoney(cost || 0)} • Zone: ${escapeHtml(zoneCode)}</div>
                        </div>
                    </div>
                `;
                reasonText = '';
            } else {
                reasonText = detailText.includes('Reason:')
                    ? detailText.split(/Reason:\s*/i)[1]
                    : detailText;
            }

            const cleanReason = (reasonText || '').replace(/^Reason:\s*/i, '').trim();

            let noteBoxHtml = '';
            if (productTablesHtml) {
                if (cleanReason) {
                    noteBoxHtml = `
                        <div class="detail-note-box" style="margin-top: 14px;">
                            <span>Reason:</span>
                            <p>${escapeHtml(cleanReason)}</p>
                        </div>
                    `;
                }
            } else {
                noteBoxHtml = `
                    <div class="detail-note-box">
                        <span>Reason:</span>
                        <p>${escapeHtml(cleanReason || 'No reason specified.')}</p>
                    </div>
                `;
            }

            document.getElementById('req-detail-modal-body').innerHTML = `
                <div class="detail-header-row">
                    <div>
                        <span class="detail-id-label">Request ID</span>
                        <h4 class="detail-id-title">${escapeHtml(reqId)}</h4>
                    </div>
                    <span class="badge-status badge-lg ${badgeClass}">${escapeHtml(displayStatus)}</span>
                </div>

                <div class="detail-meta-grid">
                    <div>
                        <span>Action Type</span>
                        <strong>${escapeHtml(reqType)}</strong>
                    </div>
                    <div>
                        <span>Submitted Date</span>
                        <strong>${escapeHtml(displayDate)}</strong>
                    </div>
                    <div>
                        <span>Requested By</span>
                        <strong>${escapeHtml(requestedBy)} (${escapeHtml(role)})</strong>
                    </div>
                    ${extraGridHtml}
                </div>

                ${productTablesHtml}
                ${noteBoxHtml}
                ${decisionInfo}
            `;

            openModal('modal-req-detail');
        }

        function closeReqDetailModal() {
            closeModal('modal-req-detail');
        }

        loadMyRequests();
    </script>
</body>

</html>
