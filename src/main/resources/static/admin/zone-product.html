<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Zone & Product Details</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="ADMIN" data-active-menu="zone-product"></div>

        <!-- Main Content Area -->
        <main class="main-content dashboard-main-layout">
            <!-- 1. Top Header Row -->
            <header class="requests-header-row">
                <div class="requests-header-left">
                    <h1>Zone & Product Details</h1>
                    <p>manage warehouse zone and products information</p>
                </div>
            </header>

            
            <!-- 3. Featured Showcase Cards (Reference: Image 2) -->
            <div class="zp-cards-container" id="zp-cards-container">
                <!-- Card 1: Warehouse Zone (Click to open Warehouse Zones page) -->
                <div class="zp-card-wrapper zp-card-warehouse">
                    <div class="zp-feature-card" id="card-warehouse-zone" onclick="window.location.href='warehouse-zones.html'" title="Click to view Warehouse Zones">
                        <div class="zp-card-content">
                            <h2 class="zp-card-title">Warehouse Zone</h2>
                            <p class="zp-card-desc">view and manage warehouse zones</p>

                            <div class="zp-stats-list">
                                <div class="zp-stat-row">
                                    <span class="zp-bullet">•</span>
                                    <span class="zp-stat-title">Active zone:</span>
                                    <span class="zp-stat-num">3</span>
                                </div>
                                <div class="zp-stat-row">
                                    <span class="zp-bullet">•</span>
                                    <span class="zp-stat-title">Stored Units:</span>
                                    <span class="zp-stat-num">900</span>
                                </div>
                            </div>
                        </div>
                        <div class="zp-card-visual">
                            <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=900&q=80"
                                alt="Warehouse Zone Interior"
                                onerror="this.parentElement.innerHTML='<div class=\'zp-placeholder-box\'><svg width=\'64\' height=\'64\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#94a3b8\' stroke-width=\'1.5\'><path d=\'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\'></path></svg></div>'">
                        </div>
                    </div>
                </div>

                <!-- Card 2: Product Management (Click to open Product Management page) -->
                <div class="zp-card-wrapper zp-card-product">
                    <div class="zp-feature-card" id="card-product-management" onclick="window.location.href='product-management.html'" title="Click to view Product Management">
                        <div class="zp-card-content">
                            <h2 class="zp-card-title">Product Management</h2>
                            <p class="zp-card-desc">manage products detail and inventory</p>

                            <div class="zp-stats-list">
                                <div class="zp-stat-row">
                                    <span class="zp-bullet">•</span>
                                    <span class="zp-stat-title">Total Products:</span>
                                    <span class="zp-stat-num">9</span>
                                </div>
                                <div class="zp-stat-row">
                                    <span class="zp-bullet warning">•</span>
                                    <span class="zp-stat-title">Low Stock:</span>
                                    <span class="zp-stat-num warning">3</span>
                                </div>
                            </div>
                        </div>
                        <div class="zp-card-visual">
                            <img src="https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=900&q=80"
                                alt="Product Management Logistics"
                                onerror="this.parentElement.innerHTML='<div class=\'zp-placeholder-box\'><svg width=\'64\' height=\'64\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#94a3b8\' stroke-width=\'1.5\'><rect x=\'2\' y=\'7\' width=\'20\' height=\'14\' rx=\'2\' ry=\'2\'></rect><path d=\'M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\'></path></svg></div>'">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <!-- Scripts -->
    <script src="../js/sidebar.js"></script>
    <script>
        function openZoneModal() {
            document.getElementById('modal-zones').classList.add('active');
        }

        function openProductModal() {
            document.getElementById('modal-products').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
        });
    </script>
</body>

</html>
