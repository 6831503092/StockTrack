<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTrack - Staff Dashboard</title>
    <link rel="icon" type="image/png" href="../picture/favicon/favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation (Modular Component) -->
        <div id="sidebar-container" data-role="STAFF" data-active-menu="dashboard"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <h1>Staff Dashboard</h1>
                <p>Welcome back, Staff. Check daily inventory, stock picking, and logistics tasks.</p>
            </header>

            <section class="placeholder-card">
                <p style="color: #64748b;">Main content display area for Staff Dashboard</p>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        (function checkAccess() {
            const raw = localStorage.getItem('stocktrack_user');
            if (!raw) {
                window.location.replace('../index.html');
                return;
            }
            try {
                const user = JSON.parse(raw);
                if (!user || user.role !== 'STAFF') {
                    window.location.replace('../index.html');
                }
            } catch (err) {
                localStorage.removeItem('stocktrack_user');
                window.location.replace('../index.html');
            }
        })();
    </script>
</body>
</html>
