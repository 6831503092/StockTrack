<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockTrack - Receive Items</title><link rel="icon" href="../assets/favicon/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/pages/staff.css">
</head>
<body class="staff-dashboard receive-workflow">
<a class="staff-skip-link" href="#staff-main">Skip to content</a>
<div class="app-layout"><div id="sidebar-container" data-role="STAFF" data-active-menu="receive"></div>
<main class="main-content" id="staff-main" tabindex="-1">
<header class="staff-header"><div class="workflow-hero-copy"><p class="workflow-hero-kicker">INBOUND / RECEIVING</p><h1>Receive Items</h1><p id="receive-subtitle">Select an approved request to begin</p></div><div class="workflow-hero-art receive-art" aria-hidden="true"><svg viewBox="0 0 180 140" fill="none"><path d="m27 48 63-33 63 33v62l-63 33-63-33V48Z" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="m27 48 63 35 63-35M90 83v60" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M90 69V37m0 0L77 50m13-13 13 13" stroke="#dbffe9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M69 94h42" stroke="#fff" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="27" r="5" fill="#c6ffdc"/></svg></div><span class="connection-status" id="receive-connection" role="status"><span></span>Online</span></header>
<p class="receive-eyebrow">RECEIVE WORKFLOW / <span id="receive-stage-label">REQUESTS</span></p>
<h2 id="receive-stage-title" tabindex="-1">Requests</h2>
<ol class="receive-steps" aria-label="Workflow progress"><li aria-current="step">1. Requests</li><li>2. Verify</li><li>3. Confirm</li><li>4. Result</li></ol>
<p id="receive-alert" role="alert" hidden></p>
<section aria-live="polite" id="receive-stage-content" aria-labelledby="receive-stage-title"></section>
<div class="workflow-actions" id="workflow-actions">
<button type="button" id="receive-reject" class="btn-reject" hidden style="margin-right: auto;">✕ Reject Order</button>
<button type="button" id="receive-back" hidden>← Back</button>
<button type="button" id="receive-next">Continue →</button>
</div>
<dialog id="receive-reject-modal" class="staff-reject-dialog">
  <form method="dialog" id="receive-reject-form">
    <h3>Reject Purchase Order</h3>
    <p>Please specify the reason for rejecting this order. (Required)</p>
    <p id="receive-reject-error" class="modal-error" hidden></p>
    <textarea id="receive-reject-reason" required placeholder="Specify reason for rejection (e.g., Goods damaged, wrong products, quantity shortage/excess)..." rows="4"></textarea>
    <div class="modal-actions">
      <button type="button" class="btn-modal-cancel" id="receive-reject-cancel">Cancel</button>
      <button type="submit" class="btn-modal-confirm-reject" id="receive-reject-confirm">Confirm Reject</button>
    </div>
  </form>
</dialog>
</main></div>
<script src="../js/common/api.js"></script><script src="../js/common/sidebar.js"></script><script src="../js/common/auth.js"></script><script src="../js/staff/staff-wizard.js"></script><script src="../js/staff/receive-items.js"></script>
</body></html>
